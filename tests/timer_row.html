<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Jarvis timer row regression</title>
<pre id="results">Running…</pre><iframe id="page"></iframe>
<script type="module">
const results = document.getElementById('results'), frame = document.getElementById('page');
try {
  const html = await (await fetch('../ui/ui.html')).text(), orbs = await (await fetch('../ui/orbs.js')).text();
  const ready = new Promise(resolve => addEventListener('message', e => e.source === frame.contentWindow && e.data?.ready && resolve()));
  const bridge = `<script>
    window.webkit = {messageHandlers: new Proxy({}, {get: () => ({postMessage: value => value?.ready && parent.postMessage(value, '*')})})};
  <\/script>`;
  frame.srcdoc = html.replace('/*ORBS*/', () => orbs).replace('<head>', '<head>' + bridge);
  await ready;
  await new Promise(resolve => setTimeout(resolve, 500));

  const ui = frame.contentWindow.ui, d = frame.contentDocument;
  ui.listen(true); ui.words('Earlier ask'); ui.think(); ui.line('✓ Earlier answer');
  ui.dictate(true); ui.listen('dict'); ui.finishing(''); ui.dictated({text: '', ok: true});
  ui.listen(); ui.dictate(false); ui.words('Why is the sky blue?'); ui.think(); ui.line('▸ Thinking it through');

  const turns = d.querySelectorAll('#thread > .turn');
  if (turns.length !== 2) throw Error(`new ask did not get its own turn (${turns.length})`);
  const current = turns[1];
  if (current.querySelector('.q')?.textContent !== 'Why is the sky blue?') throw Error('question is not in the new turn');
  if (!current.querySelector('.elapsed')?.offsetHeight) throw Error('new ask has no visible timer row');
  if (current.querySelector('.step')?.textContent !== 'Thinking it through' || !current.querySelector('.step').offsetHeight) throw Error('new ask has no visible step line');
  ui.reset();
  const tick = ms => new Promise(resolve => setTimeout(resolve, ms));
  const thread = d.getElementById('thread');
  for (let i = 0; i < 10; i++) {
    ui.listen(true); ui.words(i === 1 ? 'Save it as a shortcut' : 'Change the setting');
    if (i % 2 === 0) ui.think();   // instant/speculative work can emit a step before think()
    ui.line('▸ Changing the setting');
    await tick(450);
    const current = thread.lastElementChild, timer = current.querySelector('.elapsed b'), step = current.querySelector('.step.live');
    if (!timer) throw Error(`turn ${i}: step arrived without a timer`);
    results.dataset.lastCheck = `turn ${i}: live step with timer ${timer.textContent}`;
    const before = parseFloat(timer.textContent), node = timer.firstChild;
    for (let n = 0; n < 20 && !(parseFloat(timer.textContent) > before); n++) await tick(50);
    if (!(parseFloat(timer.textContent) > before)) throw Error(`turn ${i}: timer did not tick while the step was live`);
    if (current.querySelector('.elapsed b') !== timer || timer.firstChild !== node || timer.childNodes.length !== 1) throw Error(`turn ${i}: ticking replaced the timer's text node`);
    const visible = e => { const r = e.getBoundingClientRect(), t = thread.getBoundingClientRect(); return r.height > 0 && r.top >= t.top && r.bottom <= t.bottom + 1; };
    if (current.querySelector('.elapsed span')) throw Error(`turn ${i}: status text beside timer`);
    if (!visible(timer) || !visible(step)) throw Error(`turn ${i}: live timer or step outside viewport`);
    ui.think();   // a later native think must keep the existing timer
    if (current.querySelectorAll('.elapsed').length !== 1) throw Error(`turn ${i}: duplicate timer`);
    ui.line('… The setting is changed and'); await tick(100);
    if (!visible(timer) || current.querySelector('.elapsed span')) throw Error(`turn ${i}: timer-only row lost while streaming`);
    ui.line('✓ Changed the setting.');
    if (i === 1) ui.line('i Learned: change the setting');
    ui.finished(); const stopped = timer.textContent; await tick(70);
    if (timer.textContent !== stopped) throw Error(`turn ${i}: completed timer kept ticking`);
  }
  results.className = 'pass'; results.textContent = 'Timer row regression passed';
} catch (error) {
  results.className = 'fail'; results.textContent = error.stack || String(error);
}
</script>
